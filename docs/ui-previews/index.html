<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Peyya — 앱 목업</title>
<style>
  :root {
    --ink: #1A1A1A;
    --sub: #5B6270;
    --brand: #2F6BFF;
    --bg0: #0E1116;
    --bg1: #1A2230;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    font-family: "Pretendard","Noto Sans KR",system-ui,sans-serif;
    color: #F2F4F7;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(46,213,115,.18), transparent 55%),
      radial-gradient(900px 500px at 90% 10%, rgba(76,141,255,.16), transparent 50%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #12151A);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 32px;
    gap: 16px;
  }
  .top {
    width: min(420px, 100%);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .top h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -.2px;
  }
  .top p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #A8B0BC;
    line-height: 1.45;
  }
  .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .links a {
    text-decoration: none;
    color: #F2F4F7;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .links a:hover { border-color: rgba(46,213,115,.5); color: #2ED573; }
  .device {
    position: relative;
    width: min(390px, 100%);
    height: min(844px, calc(100vh - 120px));
    border-radius: 40px;
    padding: 12px;
    background: linear-gradient(160deg, #2A313A, #12151A);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.08),
      0 28px 60px rgba(0,0,0,.45);
  }
  .device .bezel {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    width: 118px; height: 28px;
    border-radius: 999px;
    background: #0A0C10;
    z-index: 2;
    pointer-events: none;
  }
  .device iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 30px;
    background: #fff;
  }
  .hint {
    width: min(420px, 100%);
    font-size: 12px;
    color: #A8B0BC;
    line-height: 1.45;
    text-align: center;
  }
  .hint b { color: #F2F4F7; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>페이야 앱 목업</h1>
      <p>최신 구현 화면을 폰 안에서 그대로 조작합니다.</p>
    </div>
    <div class="links">
      <a href="phone-plan-connect.html?embed=1" target="peyyaApp" id="restart">처음부터</a>
      <a href="gallery.html">옛 캡처 아카이브</a>
    </div>
  </div>

  <div class="device" aria-label="Peyya phone mock">
    <div class="bezel" aria-hidden="true"></div>
    <iframe
      name="peyyaApp"
      id="appFrame"
      title="Peyya"
      src="phone-plan-connect.html?embed=1"
      allow="geolocation"
    ></iframe>
  </div>

  <p class="hint">
    <b>사전설정 → 지도·코스 → 실행 → 완료·별점</b> 순으로 탭과 버튼을 눌러 보세요.
    지도·영업시간·알림 리뷰는 최신 HTML 기준입니다.
  </p>
</body>
</html>
