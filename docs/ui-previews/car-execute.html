<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Peyya — 차량 내비 위젯</title>
<script>if(/[?&]embed=1(?:&|$)/.test(location.search))document.documentElement.classList.add('embed');</script>
<style>
  :root {
    --bg: #0B0E13;
    --panel: #12151A;
    --card: #1A1F26;
    --line: #2C343E;
    --text: #F2F4F7;
    --sub: #A8B0BC;
    --brand: #4C8DFF;
    --green: #2ED573;
    --warn: #FFB020;
    --nav-green: #2ED573;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px;
    font-family: "Pretendard","Noto Sans KR",system-ui,sans-serif;
    background: #0E1116; color: var(--text);
  }
  h1.page { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 13px; margin: 0 0 14px; line-height: 1.45; max-width: 960px; }
  .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .modes button {
    border: 1px solid var(--line); background: #1A1F26; color: var(--sub);
    border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .modes button.on { background: var(--brand); color: #fff; border-color: var(--brand); }

  .car {
    width: min(1180px, 100%);
    aspect-ratio: 16 / 9;
    max-height: min(640px, 78vh);
    margin: 0 auto;
    display: flex;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #2C343E;
    background: #000;
    box-shadow: 0 24px 50px rgba(0,0,0,.45);
  }

  /* 좌측 · 본내비 (시스템) */
  .nav-pane {
    position: relative;
    flex: 1;
    min-width: 0;
    /* 실내비 캡처의 맵 영역만 보이게 (우측 카메라 위젯은 제외) */
    background-color: #1a2a22;
    background-image: url('peyya-car-nav-ref.png');
    background-repeat: no-repeat;
    background-size: 148% auto;
    background-position: left center;
  }
  .nav-pane::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 70%, rgba(18,21,26,.55) 100%);
    pointer-events: none;
  }
  .nav-label {
    position: absolute; left: 14px; top: 12px; z-index: 2;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 700; color: #fff;
  }
  .nav-label span { color: var(--nav-green); }
  .nav-hud {
    position: absolute; left: 18px; bottom: 72px; z-index: 2;
    display: flex; flex-direction: column; gap: 8px;
  }
  .turn {
    display: flex; align-items: center; gap: 12px;
    background: rgba(20,24,30,.88); border-radius: 14px;
    padding: 12px 16px; min-width: 200px;
  }
  .turn .arrow {
    width: 36px; height: 36px; border-radius: 10px; background: #fff; color: #111;
    display: grid; place-items: center; font-size: 18px; font-weight: 800;
  }
  .turn strong { display: block; font-size: 20px; }
  .turn small { color: var(--sub); font-size: 12px; }
  .nav-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    height: 56px; padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(18,21,26,.92); border-top: 1px solid rgba(255,255,255,.08);
    font-size: 13px; font-weight: 700;
  }
  .nav-bar .eta { color: var(--nav-green); }
  .nav-arrived-flash {
    position: absolute; inset: 0; z-index: 3;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35);
    font-size: 22px; font-weight: 800;
  }
  .nav-arrived-flash.on { display: flex; }

  /* 우측 · 페이야 위젯 */
  .widget {
    width: min(340px, 32%);
    flex: 0 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 16px 16px 14px;
    position: relative; z-index: 4;
  }
  .w-brand {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 12px;
  }
  .w-brand .name { font-size: 14px; font-weight: 800; color: var(--green); }
  .w-brand .tag {
    font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px;
    background: rgba(76,141,255,.18); color: var(--brand);
  }
  .w-phase { font-size: 12px; font-weight: 800; color: var(--brand); margin-bottom: 6px; }
  .widget h2 {
    margin: 0; font-size: 22px; line-height: 1.25; font-weight: 800; letter-spacing: -.3px;
  }
  .w-sub { margin: 8px 0 0; color: var(--sub); font-size: 13px; line-height: 1.4; }
  .spoken {
    margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--card);
    font-size: 13px; line-height: 1.4;
  }
  .spoken .lab { font-size: 11px; font-weight: 800; color: var(--brand); margin-bottom: 4px; }
  .tip {
    margin-top: 12px; padding: 12px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
  }
  .tip .k { font-size: 11px; font-weight: 800; color: var(--warn); }
  .tip h3 { margin: 4px 0 4px; font-size: 15px; }
  .tip p { margin: 0; color: var(--sub); font-size: 12px; line-height: 1.4; }
  .badge {
    display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 5px;
    background: rgba(255,176,32,.16); color: var(--warn); font-size: 10px; font-weight: 800;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    border: 1px solid var(--line); background: #252B33; color: var(--text);
    border-radius: 999px; padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .actions {
    margin-top: auto; padding-top: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .cta {
    width: 100%; height: 48px; border: 0; border-radius: 12px;
    background: var(--brand); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .cta.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--line);
  }
  .cta:disabled { opacity: .45; cursor: default; }
  .progress {
    margin-top: 10px; height: 4px; border-radius: 999px; background: #2A313A; overflow: hidden;
  }
  .progress > i {
    display: block; height: 100%; width: 0; background: var(--green);
    transition: width .2s linear;
  }
  .note {
    margin-top: 8px; font-size: 11px; color: var(--sub); line-height: 1.35;
  }

  html.embed, html.embed body {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000;
  }
  html.embed h1.page, html.embed .sub, html.embed .modes { display: none !important; }
  html.embed .car {
    width: 100%; height: 100%; max-height: none; aspect-ratio: auto;
    margin: 0; border: 0; border-radius: 0; box-shadow: none;
  }
</style>
</head>
<body>
  <h1 class="page">Peyya — 차량 · 본내비 + 우측 위젯</h1>
  <p class="sub">
    좌측은 <b>시스템 내비</b>(길안내), 우측은 <b>페이야 위젯</b>(목적지 설명·주차 팁·음성/버튼).
    도착은 자동 감지되고, 팁은 다시 듣기·버튼·음성 시뮬로 확인합니다.
  </p>
  <div class="modes">
    <button type="button" class="on" data-phase="enroute">안내 중</button>
    <button type="button" data-phase="arrived">도착 · 팁</button>
    <button type="button" data-phase="next">다음 장소</button>
    <button type="button" data-phase="review">리뷰</button>
  </div>

  <div class="car" id="car"></div>

<script>
const DEST = {
  name: '국립중앙박물관',
  next: '용산 한식 담소',
  address: '서울 용산구 서빙고로 137',
  tipTitle: '주차 · 입장',
  tipBody: '지하 주차 후 중앙 홀 쪽으로 이동하면 특별전이 가깝습니다. 주말엔 서쪽 입구가 덜 붐벼요.',
  brief: '국립중앙박물관 안내를 시작합니다. 가는 길에 주차와 입장을 참고하세요.',
  arrivedSpeak: '목적지에 도착했어요. 주차와 입장 팁을 들려드릴까요?',
};
let phase = 'enroute';
let tipOpen = false;
let arriveTimer = null;
let arrivePct = 0;

function clearArriveTimer() {
  if (arriveTimer) { clearInterval(arriveTimer); arriveTimer = null; }
}

function startAutoArrive() {
  clearArriveTimer();
  arrivePct = 0;
  arriveTimer = setInterval(() => {
    arrivePct = Math.min(100, arrivePct + 4);
    const bar = document.getElementById('arriveBar');
    if (bar) bar.style.width = arrivePct + '%';
    if (arrivePct >= 100) {
      clearArriveTimer();
      phase = 'arrived';
      tipOpen = false;
      flashArrive();
      render();
    }
  }, 120);
}

function flashArrive() {
  const flash = document.getElementById('arriveFlash');
  if (!flash) return;
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 900);
}

function widgetBody() {
  if (phase === 'enroute') {
    return `
      <div class="w-phase">안내 중 · 페이야 위젯</div>
      <h2>${DEST.name}</h2>
      <p class="w-sub">길안내는 좌측 내비가 맡아요. 여기선 목적지 브리핑과 팁만 보여 줍니다.</p>
      <div class="spoken">
        <div class="lab">내비 음성 · 목적지 브리핑</div>
        「${DEST.brief}」
      </div>
      <div class="tip">
        <div class="k">미리 보기 · ${DEST.tipTitle}</div>
        <h3>도착하면 자동으로 펼쳐져요</h3>
        <p>${DEST.tipBody}</p>
      </div>
      <div class="progress" title="도착 자동 감지"><i id="arriveBar" style="width:${arrivePct}%"></i></div>
      <p class="note">도착 자동 감지 중… (시연) 감지되면 우측 위젯이 팁 모드로 바뀝니다.</p>
      <div class="actions">
        <button class="cta ghost" id="replay">브리핑 다시 듣기</button>
        <button class="cta" id="forceArrive">지금 도착으로 보기 (데모)</button>
      </div>`;
  }
  if (phase === 'arrived') {
    return `
      <div class="w-phase">도착 · 자동 감지됨</div>
      <h2>도착했어요</h2>
      <p class="w-sub">${DEST.name}<br/>${DEST.address}</p>
      <div class="spoken">
        <div class="lab">페이야 음성</div>
        「${DEST.arrivedSpeak}」
      </div>
      <div class="tip">
        <div class="k">주차 · 입장 팁 <span class="badge">시연</span></div>
        <h3>${DEST.tipTitle}</h3>
        <p>${tipOpen ? DEST.tipBody : '버튼이나 음성으로 자세한 팁을 확인할 수 있어요.'}</p>
      </div>
      <div class="chips">
        <button type="button" class="chip" data-act="tip">주차 알려줘</button>
        <button type="button" class="chip" data-act="replay">다시 듣기</button>
        <button type="button" class="chip" data-act="next">다음</button>
      </div>
      <div class="actions">
        <button class="cta" id="showTip">${tipOpen ? '팁 접기' : '주차·입장 팁 보기'}</button>
        <button class="cta ghost" id="toNext">다음 장소 제안</button>
      </div>`;
  }
  if (phase === 'next') {
    return `
      <div class="w-phase">다음 장소 제안</div>
      <h2>${DEST.next}로<br/>안내할까요?</h2>
      <p class="w-sub">재검색 없이 계획한 다음 장소로 이어집니다. 좌측 내비가 새 목적지를 받습니다.</p>
      <div class="spoken">
        <div class="lab">페이야 음성</div>
        「박물관 잘 보셨나요? 다음으로 맛집 안내할까요?」
      </div>
      <div class="tip">
        <div class="k">음성 시뮬 (시연)</div>
        <p>STT 대신 칩으로 명령을 넣습니다.</p>
      </div>
      <div class="chips">
        <button type="button" class="chip" data-act="go">다음</button>
        <button type="button" class="chip" data-act="skip">건너뛰기</button>
        <button type="button" class="chip" data-act="stay">유지</button>
      </div>
      <div class="actions">
        <button class="cta" id="startNext">안내 시작</button>
        <button class="cta ghost" id="toReview">루트 마치기</button>
      </div>`;
  }
  return `
    <div class="w-phase">루트 완료 · 리뷰</div>
    <h2>오늘 루트가<br/>끝났어요</h2>
    <p class="w-sub">알림으로도 안내했어요. Phone에서 별점·한 줄 후기를 남길 수 있어요.</p>
    <div class="tip">
      <div class="k">알림 · 페이야</div>
      <h3>별점과 후기</h3>
      <p>장소마다 별점(필수)·메모(선택). 차량에선 짧게 초대만 합니다.</p>
    </div>
    <div class="actions">
      <button class="cta" id="backEnroute">시연 처음으로</button>
    </div>`;
}

function render() {
  document.querySelectorAll('.modes button').forEach(b => {
    b.classList.toggle('on', b.dataset.phase === phase);
  });

  const eta = phase === 'enroute'
    ? '<span class="eta">도착 14:45 · 1.2km</span>'
    : phase === 'arrived'
      ? '<span class="eta">도착함</span>'
      : '<span class="eta">다음 목적지 대기</span>';

  const turnDist = phase === 'enroute' ? '600m' : phase === 'arrived' ? '도착' : '—';

  document.getElementById('car').innerHTML = `
    <section class="nav-pane" aria-label="시스템 내비">
      <div class="nav-label">시스템 내비 · <span>길안내</span></div>
      <div class="nav-hud">
        <div class="turn">
          <div class="arrow">↱</div>
          <div><strong>${turnDist}</strong><small>${DEST.name} 방면</small></div>
        </div>
      </div>
      <div class="nav-bar">
        <span>본내비</span>
        ${eta}
      </div>
      <div class="nav-arrived-flash" id="arriveFlash">도착 감지</div>
    </section>
    <aside class="widget" aria-label="페이야 위젯">
      <div class="w-brand">
        <div class="name">페이야</div>
        <div class="tag">위젯</div>
      </div>
      ${widgetBody()}
    </aside>`;

  bind();
  if (phase === 'enroute' && !arriveTimer && arrivePct < 100) startAutoArrive();
  if (phase !== 'enroute') clearArriveTimer();
}

function bind() {
  const replay = document.getElementById('replay');
  const forceArrive = document.getElementById('forceArrive');
  const showTip = document.getElementById('showTip');
  const toNext = document.getElementById('toNext');
  const startNext = document.getElementById('startNext');
  const toReview = document.getElementById('toReview');
  const backEnroute = document.getElementById('backEnroute');

  if (replay) replay.onclick = () => alert('「' + DEST.brief + '」');
  if (forceArrive) forceArrive.onclick = () => {
    clearArriveTimer();
    arrivePct = 100;
    phase = 'arrived';
    tipOpen = false;
    flashArrive();
    render();
  };
  if (showTip) showTip.onclick = () => { tipOpen = !tipOpen; render(); };
  if (toNext) toNext.onclick = () => { phase = 'next'; render(); };
  if (startNext) startNext.onclick = () => {
    phase = 'enroute';
    arrivePct = 0;
    tipOpen = false;
    DEST.name = '용산 한식 담소';
    DEST.next = '귀가';
    DEST.address = '서울 용산구 한강대로 405 인근';
    DEST.tipTitle = '대기 · 좌석';
    DEST.tipBody = '주말 점심은 대기 있을 수 있어요. 발렛보다 인근 공영주차 추천.';
    DEST.brief = '용산 한식 담소로 안내를 시작합니다.';
    DEST.arrivedSpeak = '맛집에 도착했어요. 대기·주차 팁을 들려드릴까요?';
    render();
  };
  if (toReview) toReview.onclick = () => { phase = 'review'; render(); };
  if (backEnroute) backEnroute.onclick = () => {
    DEST.name = '국립중앙박물관';
    DEST.next = '용산 한식 담소';
    DEST.address = '서울 용산구 서빙고로 137';
    DEST.tipTitle = '주차 · 입장';
    DEST.tipBody = '지하 주차 후 중앙 홀 쪽으로 이동하면 특별전이 가깝습니다. 주말엔 서쪽 입구가 덜 붐벼요.';
    DEST.brief = '국립중앙박물관 안내를 시작합니다. 가는 길에 주차와 입장을 참고하세요.';
    DEST.arrivedSpeak = '목적지에 도착했어요. 주차와 입장 팁을 들려드릴까요?';
    phase = 'enroute';
    tipOpen = false;
    arrivePct = 0;
    render();
  };

  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => {
      const a = btn.dataset.act;
      if (a === 'tip') { tipOpen = true; render(); }
      if (a === 'replay') alert('「' + DEST.arrivedSpeak + '」');
      if (a === 'next' || a === 'go') { phase = 'next'; render(); }
      if (a === 'skip') { phase = 'review'; render(); }
      if (a === 'stay') { /* no-op */ }
    };
  });
}

document.querySelectorAll('.modes button').forEach(btn => {
  btn.onclick = () => {
    phase = btn.dataset.phase;
    tipOpen = phase === 'arrived';
    arrivePct = phase === 'enroute' ? 0 : 100;
    clearArriveTimer();
    render();
  };
});

render();
</script>
<script src="preview-embed.js"></script>
</body>
</html>
