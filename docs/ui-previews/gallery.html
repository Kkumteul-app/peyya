<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Peyya — 옛 캡처 아카이브</title>
<style>
  body {
    margin: 0; padding: 28px 20px 64px;
    font-family: "Pretendard","Noto Sans KR",system-ui,sans-serif;
    background: #E6EAF0; color: #1A1A1A;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #5B6270; font-size: 13px; margin: 0 0 16px; line-height: 1.45; }
  .banner {
    background: #12151A; color: #F2F4F7; border-radius: 16px; padding: 16px 18px;
    margin-bottom: 20px;
  }
  .banner p { margin: 0 0 12px; font-size: 14px; color: #A8B0BC; line-height: 1.45; }
  .banner a {
    display: inline-block; text-decoration: none; background: #2ED573; color: #0B1210;
    border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 800;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px;
  }
  figure {
    margin: 0; background: #fff; border: 1px solid #C5CCD6; border-radius: 16px; overflow: hidden;
  }
  figcaption { padding: 10px 12px; font-size: 12px; font-weight: 700; border-bottom: 1px solid #E6EAF0; }
  img { display: block; width: 100%; height: auto; background: #F1F3F6; }
  .note { margin-top: 16px; font-size: 12px; color: #5B6270; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>옛 캡처 아카이브</h1>
    <p class="sub">과거 스크린샷 보관용입니다. 최신 UI는 앱 목업에서 확인하세요.</p>
    <div class="banner">
      <p>지금 쓰는 화면(사전설정 · 브이월드 지도 · 실행 · 리뷰)은 정적 이미지가 아니라 최신 HTML 목업입니다.</p>
      <a href="index.html">앱 목업으로 돌아가기</a>
    </div>
    <div class="grid">
      <figure><figcaption>사전설정 (최신 캡처)</figcaption><img src="peyya-plan-prefs.png" alt="" /></figure>
      <figure><figcaption>실행 대기</figcaption><img src="peyya-execute-idle.png" alt="" /></figure>
      <figure><figcaption>안내 중</figcaption><img src="peyya-execute-nav.png" alt="" /></figure>
      <figure><figcaption>완료·알림</figcaption><img src="peyya-execute-done.png" alt="" /></figure>
      <figure><figcaption>리뷰 초대</figcaption><img src="peyya-review-invite.png" alt="" /></figure>
      <figure><figcaption>별점 작성</figcaption><img src="peyya-review-rating.png" alt="" /></figure>
      <figure><figcaption>브이월드 UI</figcaption><img src="peyya-plan-vworld-ui.png" alt="" /></figure>
      <figure><figcaption>검색 결과</figcaption><img src="peyya-plan-search-results.png" alt="" /></figure>
      <figure><figcaption>구버전 전체 탭</figcaption><img src="peyya-all-tabs.png" alt="" /></figure>
      <figure><figcaption>구버전 계획</figcaption><img src="peyya-plan-naver.png" alt="" /></figure>
      <figure><figcaption>구버전 실행</figcaption><img src="peyya-execute-tab.png" alt="" /></figure>
      <figure><figcaption>추천</figcaption><img src="peyya-recommend-tab.png" alt="" /></figure>
      <figure><figcaption>마이</figcaption><img src="peyya-my-tab.png" alt="" /></figure>
    </div>
    <p class="note">아카이브 · 실제 조작은 index.html 앱 목업을 사용하세요.</p>
  </div>
</body>
</html>
